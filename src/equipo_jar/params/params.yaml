# Parámetros del equipo (reglamento §9.1).
#
# Acá solo van valores GENERALES: umbrales, ganancias, límites de velocidad,
# rangos de color. Nada que dependa del mapa de la competencia: nada de
# coordenadas, rutas ni posiciones de víctimas. El CI (tools/verificar_params.py)
# rechaza estos archivos si rompen la regla.
#
nodo_equipo:
  ros__parameters:
    frecuencia_control_hz: 10.0
    velocidad_lineal_max: 0.30      # m/s
    velocidad_angular_max: 1.00     # rad/s
    # Recorrer el laberinto siguiendo la pared (workshop de la semana 03).
    angulo_frente_deg: 180.0        # el frente del robot en el /scan (el lidar simulado está al revés)
    ancho_frontal_deg: 40.0         # ancho del sector frontal que mira el lidar
    ancho_lateral_deg: 20.0         # ancho del sector que mira justo a la derecha, para seguir la pared
    distancia_choque_m: 0.45        # algo de frente a menos de esto (m): hay que girar
    despeje_extra_m: 0.15           # lugar extra (m) que hace falta para dejar de girar
    distancia_pared_m: 0.45         # a qué distancia (m) se sigue la pared de la derecha
    pared_perdida_m: 1.20           # más lejos que esto (m) se considera que la pared se terminó
    memoria_pared_s: 2.0            # cuánto se recuerda (s) que la pared de la derecha se terminó
    ganancia_pared: 2.0             # cuánto corrige el giro por cada metro de error
    amortiguacion_pared: 4.0        # cuánto frena la corrección según qué tan rápido cambia el error
    # Detectar las cajas rojas (workshop de la semana 04).
    saturacion_min: 120             # S mínima (0-255) para contar un píxel como rojo
    valor_min: 80                   # V mínimo (0-255)
    area_minima_px: 400.0           # una mancha roja más chica que esto (px) se descarta
    margen_borde_px: 5              # una mancha a menos de esto (px) del borde está cortada: se descarta
    fraccion_central: 0.6           # qué parte del ancho de la caja mira el lidar (el centro)
    distancia_min_deteccion_m: 0.35 # rango de distancias donde la medición sirve
    distancia_max_deteccion_m: 3.0
    semilado_caja_m: 0.125          # medio lado de la caja: del frente al centro (medilo)
    alto_caja_m: 0.30               # alto de la caja (medilo): da una segunda estimación de la distancia
    tolerancia_distancia: 0.25      # cuánto pueden diferir (fracción) la distancia del lidar y la de la imagen
    confirmaciones: 5               # vistas seguidas que tienen que coincidir para reportar
    dispersion_max_m: 0.25          # cuánto pueden diferir esas vistas entre sí (m)
    radio_duplicado_m: 0.60         # a menos de esto de una víctima ya reportada, es la misma
